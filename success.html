<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran Berhasil - Quantum Leaps</title>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Rajdhani', sans-serif;
  background: #080A0D;
  color: #E8E0CC;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.container {
  text-align: center;
  max-width: 500px;
  padding: 40px;
}
.icon {
  font-size: 80px;
  margin-bottom: 20px;
}
h1 {
  font-size: 32px;
  color: #D4AF37;
  margin: 0 0 10px 0;
}
p {
  font-size: 18px;
  color: #6B7A8D;
  margin: 0 0 30px 0;
}
.btn {
  display: inline-block;
  padding: 14px 32px;
  background: #D4AF37;
  color: #080A0D;
  text-decoration: none;
  border-radius: 6px;
  font-weight: 600;
  font-size: 16px;
}
.btn:hover {
  background: #F0D060;
}
</style>
</head>
<body>
<div class="container">
  <div class="icon">✓</div>
  <h1>Pembayaran Berhasil!</h1>
  <p id="message">Akun Premium Anda telah diaktifkan.</p>
  <a href="/" class="btn">MULAI KALKULASI</a>
</div>

<script>
// Activate premium from URL params
const params = new URLSearchParams(window.location.search);
const email = params.get('email');
const plan = params.get('plan');

if (email && plan) {
  localStorage.setItem('ql-premium', 'true');
  localStorage.setItem('ql-user-email', email);
  localStorage.setItem('ql-user-plan', plan);
  localStorage.setItem('ql-activated-at', Date.now());
  
  document.getElementById('message').textContent = 
    `Akun Premium Anda (${plan.toUpperCase()}) telah diaktifkan.`;
}

// Auto redirect after 3s
setTimeout(() => window.location.href = '/', 3000);
</script>
</body>
</html>
